# Um hostname por universo. *.localhost resolve sozinho para 127.0.0.1.
# Hosts diferentes são necessários: os cookies de login não distinguem portas.
#
# O upstream vai numa variável para o nginx voltar a resolver o nome pelo DNS
# do Docker; sem isto guarda o IP do arranque e, se os containers web forem
# reiniciados e trocarem de IP, um universo passa a servir o outro.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name milkyway.localhost localhost;
    location / {
        set $upstream web-milkyway;
        proxy_pass http://$upstream;
        include /etc/nginx/conf.d/proxy.inc;
    }
}

server {
    listen 80;
    server_name andromeda.localhost;
    location / {
        set $upstream web-andromeda;
        proxy_pass http://$upstream;
        include /etc/nginx/conf.d/proxy.inc;
    }
}
