# IP real dos jogadores atrás do proxy nginx.
# Sem isto o REMOTE_ADDR é sempre o do nginx: todos os jogadores parecem ter o
# mesmo IP (bans por IP e o registo de auditoria ficam inúteis) e as sessões,
# que são validadas com o IP, caem sempre que o container do proxy muda de IP.
# O nginx acrescenta o IP do cliente a X-Forwarded-For; confiamos só em proxies
# de redes privadas (a rede do Docker), por isso o cliente não consegue forjar.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 10.0.0.0/8
RemoteIPInternalProxy 172.16.0.0/12
RemoteIPInternalProxy 192.168.0.0/16
